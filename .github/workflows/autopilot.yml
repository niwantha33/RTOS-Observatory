name: Autopilot policy tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  autopilot:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify AUT-01 fail-closed policy and state machine
        run: python -m unittest discover -s tests -p test_autopilot_runner.py -v
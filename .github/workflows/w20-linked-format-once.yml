name: W20-linked one-time clang-format
on:
  push:
    branches: [feature/w20-linked-analysis-dockable-workspace]
    paths:
      - .github/workflows/w20-linked-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/w20-linked-analysis-dockable-workspace
          persist-credentials: true
      - run: sudo apt-get update -qq && sudo apt-get install -y clang-format
      - name: Format owned W20 code
        shell: bash
        run: |
          set -euo pipefail
          clang-format -i --style=file \
            src/ctf_analysis.cpp \
            include/observatory/ctf_analysis.hpp \
            tests/test_ctf_analysis.cpp \
            desktop/imgui/main.cpp \
            desktop/imgui/workspace.cpp \
            desktop/imgui/workspace.hpp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/ctf_analysis.cpp \
            include/observatory/ctf_analysis.hpp \
            tests/test_ctf_analysis.cpp \
            desktop/imgui/main.cpp \
            desktop/imgui/workspace.cpp \
            desktop/imgui/workspace.hpp
          if ! git diff --cached --quiet; then
            git commit -m "style(W20): format linked CTF analyses and docking UI"
            git push origin HEAD:feature/w20-linked-analysis-dockable-workspace
          fi

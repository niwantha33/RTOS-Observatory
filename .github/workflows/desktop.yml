name: Native desktop W05
on: [push, pull_request]

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure Qt desktop
        run: cmake -S . -B build-desktop -DOBSERVATORY_BUILD_DESKTOP=ON -DOBSERVATORY_BUILD_LIVE=OFF -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - name: Build native UI and C++ core
        run: cmake --build build-desktop --config ${{ matrix.configuration }} --parallel 2
      - name: CTest model, CLI and native offscreen widget
        run: ctest --test-dir build-desktop -C ${{ matrix.configuration }} --output-on-failure

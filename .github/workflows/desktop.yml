name: Native desktop Dear ImGui
on: [push, pull_request]

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux GLFW/OpenGL/Xvfb dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb
      - name: Activate Windows MSVC and Windows SDK tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Configure native ImGui desktop
        run: cmake -S . -B build-desktop -G Ninja -DOBSERVATORY_BUILD_DESKTOP=ON -DOBSERVATORY_BUILD_LIVE=OFF -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - name: Build ImGui UI and C++ core
        run: cmake --build build-desktop --parallel 2
      - name: CTest offline model, CLI, controller and UI smoke
        run: ctest --test-dir build-desktop --output-on-failure

  # Reproduces local clang-cl + lld-link + MSVC CRT/Windows SDK configuration.
  # Separate from the existing native MSVC desktop matrix; no VsDevCmd.bat.
  windows-clang-cl:
    name: Windows clang-cl / ${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Discover MSVC runtime and SDK, configure, build and test
        shell: pwsh
        run: >
          pwsh -NoProfile -ExecutionPolicy Bypass -File
          .\tools\build-windows-clang.ps1
          -Configuration ${{ matrix.configuration }}
          -BuildDirectory build-windows-clang-${{ matrix.configuration }}
